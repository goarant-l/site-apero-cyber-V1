# A quoi cela sert ?
# log_errors : indique si le message d'erreur doit être enregistré dans le journal d'erreurs du serveur ou dans error log.
# error_log : c'est le nom du fichier où seront enregistrées les erreurs. Si la valeur spécial syslog est utilisée, les erreurs seront envoyées au système d'historique du serveur, si pas fixée, les erreurs seront envoyées au journal d'erreurs SAPI.
log_errors = …
error_log = …

# A quoi cela sert ?
# display_errors : détermine si les erreurs doivent être affichées à l'écran dans la sortie, ou si elles doivent être cachées. Si la valeur est activée, les erreurs seront affichées à l'écran, sinon elles seront cachées.
# display_startup_errors : même si display erros est activé des erreurs peuvent survenir lors de la séquence de démarrage de PHP, et ces erreurs sont cachées. Avec cette option il est possible de les afficher ce qui est recommandé pour le débogage. Sinon il est fortement recommandé de laisse cette directive à off.
display_errors = …
display_startup_errors = …

# A quoi cela sert ?
# error_reporting : fixe le niveau d'erreur. Lit ou modifie le niveau de signalement des erreurs pendnat l'execution du script. Elle permet de filtrer les erreurs rapportés selon gravité.
error_reporting = …

# A quoi cela sert ?
# ignore_repeated_errors : Ne pas enregistrer des messages répétitifs. Les erreurs répétées doivent survenir au même moment, à la même ligne et depuis le même fichier de script, à moins que ignore_repeated_source soit défini à true.
# gnore_repeated_source : Ignore la source du message lors des messages répétés. Lorsqu'on a configuré cette option à On, ne seront pas enregistrées les erreurs répétées provenant de fichiers et lignes de code différents.
ignore_repeated_errors = …
ignore_repeated_source = …

